<svg width="600" height="750" viewBox="0 0 600 750" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad-outerwear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141210"/>
      <stop offset="1" stop-color="#1b1815"/>
    </linearGradient>
    <pattern id="stripes-outerwear" width="14" height="14" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="transparent"/>
      <line x1="0" y1="0" x2="0" y2="14" stroke="#1b1815" stroke-width="1" opacity="0.5"/>
